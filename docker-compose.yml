version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: langgraph_postgres
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: root
      POSTGRES_DB: langgraph_hitl
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d langgraph_hitl"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
